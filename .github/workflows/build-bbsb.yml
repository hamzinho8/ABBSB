name: BlackBerry OS 5 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ☕ Setup Java 7 (32-bit requis pour RAPC)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '7'
        architecture: x86

    - name: 🔑 Patch Registry for BlackBerry Compiler
      shell: powershell
      run: |
        Write-Host "Configuration des clés de registre Java pour RAPC et l'installeur..."
        $javaPath = $env:JAVA_HOME
        Write-Host "JAVA_HOME détecté : $javaPath"
        
        # Ajout du binaire Java au PATH de la session et de GitHub Actions
        Add-Content -Path $env:GITHUB_PATH -Value "$javaPath\bin"
        
        $versions = @("1.6", "1.7", "1.8")
        $rootKeys = @("HKLM:\SOFTWARE\JavaSoft", "HKLM:\SOFTWARE\Wow6432Node\JavaSoft")
        
        $jvmDll = Get-ChildItem -Path $javaPath -Filter "jvm.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($jvmDll) {
            $jvmPath = $jvmDll.FullName
            Write-Host "Fichier jvm.dll localisé : $jvmPath"
        } else {
            $jvmPath = "$javaPath\bin\client\jvm.dll"
            Write-Host "Fichier jvm.dll par défaut : $jvmPath"
        }
        
        foreach ($root in $rootKeys) {
            foreach ($type in @("Java Development Kit", "Java Runtime Environment")) {
                $typePath = "$root\$type"
                New-Item -Path $typePath -Force | Out-Null
                New-ItemProperty -Path $typePath -Name "CurrentVersion" -Value "1.7" -Force | Out-Null
                
                foreach ($ver in $versions) {
                    $verPath = "$typePath\$ver"
                    New-Item -Path $verPath -Force | Out-Null
                    New-ItemProperty -Path $verPath -Name "JavaHome" -Value $javaPath -Force | Out-Null
                    New-ItemProperty -Path $verPath -Name "RuntimeLib" -Value $jvmPath -Force -ErrorAction SilentlyContinue | Out-Null
                }
            }
        }
        Write-Host "Clés de registre Java créées avec succès."

    - name: 🛠️ Setup Apache Ant 1.9.16 (Compatible Java 7)
      shell: powershell
      run: |
        Write-Host "Téléchargement et configuration d'Apache Ant 1.9.16..."
        $antUrl = "https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.16-bin.zip"
        $antZip = "C:\apache-ant-1.9.16-bin.zip"
        $antDest = "C:\apache-ant"
        
        New-Item -ItemType Directory -Force -Path $antDest | Out-Null
        Invoke-WebRequest -Uri $antUrl -OutFile $antZip -UseBasicParsing
        Expand-Archive -Path $antZip -DestinationPath $antDest -Force
        
        $antHomeDir = Get-ChildItem -Path $antDest -Directory | Select-Object -First 1
        $antBin = "$($antHomeDir.FullName)\bin"
        Write-Host "Ant 1.9.16 installé avec succès dans : $($antHomeDir.FullName)"
        Write-Host "Dossier bin Ant : $antBin"
        
        Add-Content -Path $env:GITHUB_ENV -Value "ANT_HOME=$($antHomeDir.FullName)"
        Add-Content -Path $env:GITHUB_PATH -Value $antBin
        $env:PATH = "$antBin;$env:PATH"
        $env:ANT_HOME = $antHomeDir.FullName
        
        Write-Host "Vérification de Ant :"
        & "$antBin\ant.bat" -version

    - name: 🚀 Téléchargement du JDE 5.0.0
      shell: powershell
      run: |
        $url = "https://archive.org/download/blackberry-jde/BlackBerry_JDE_5.0.0.exe"
        $exePath = "C:\BlackBerry_JDE_5.0.0.exe"
        Write-Host "Téléchargement du JDE 5.0.0 depuis archive.org..."
        Invoke-WebRequest -Uri $url -OutFile $exePath
        Write-Host "Téléchargement terminé."

    - name: 📦 Extraction Silencieuse (Advanced Installer)
      shell: powershell
      run: |
        $extractPath = "C:\JDE_Extract"
        $finalJdePath = "C:\BlackBerry_JDE"
        New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
        
        Write-Host "1. Extraction de l'EXE (Advanced Installer)..."
        $process = Start-Process -FilePath "C:\BlackBerry_JDE_5.0.0.exe" -ArgumentList "/extract", "`"$extractPath`"" -PassThru -Wait
        
        Write-Host "Code de retour de l'extraction : $($process.ExitCode)"
        
        $msiFile = Get-ChildItem -Path $extractPath -Filter "*.msi" -Recurse | Select-Object -First 1
        if (-not $msiFile) {
            Write-Error "Le fichier MSI n'a pas pu être extrait. Le dossier contient :"
            Get-ChildItem -Path $extractPath -Recurse
            exit 1
        }
        Write-Host "MSI extrait avec succès : $($msiFile.FullName)"
        
        Write-Host "2. Installation Administrative (Décompression pure)..."
        $msiProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList "/a", "`"$($msiFile.FullName)`"", "/qn", "TARGETDIR=`"$finalJdePath`"" -PassThru -Wait
        Write-Host "Code de retour MSI : $($msiProcess.ExitCode)"
        Write-Host "Décompression terminée."

    - name: 🔍 Configuration du JDE
      shell: powershell
      run: |
        Write-Host "Recherche des outils de compilation..."
        $rapcExe = Get-ChildItem -Path "C:\BlackBerry_JDE" -Filter "rapc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if ($rapcExe) {
            $jdeHome = $rapcExe.Directory.Parent.FullName
            $binDir = $rapcExe.Directory.FullName
            Write-Host "Outils trouvés dans : $jdeHome"
            Write-Host "Dossier bin : $binDir"
            Add-Content -Path $env:GITHUB_ENV -Value "BLACKBERRY_JDE_HOME=$jdeHome"
            Add-Content -Path $env:GITHUB_PATH -Value $binDir
        } else {
            Write-Error "Échec : rapc.exe introuvable."
            exit 1
        }

    - name: ⚙️ Compilation du projet BlackBerry (Curve 9300)
      shell: powershell
      run: |
        Write-Host "Lancement de la compilation avec BLACKBERRY_JDE_HOME=$env:BLACKBERRY_JDE_HOME"
        Set-Location blackberry
        
        Write-Host "--- Vérification des environnements ---"
        java -version
        ant -version
        Write-Host "---------------------------------------"
        
        # Nettoyage préventif
        if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
        Get-ChildItem -Include "*.cod", "*.jar", "*.cso", "*.debug" | Remove-Item -Force -ErrorAction SilentlyContinue
        
        # Exécution de Ant avec affichage direct et enregistrement de la sortie
        Write-Host "Exécution de 'ant build'..."
        & ant build 2>&1 | Tee-Object -FilePath "rapc_output.txt"
        
        # Vérification du fichier BBSmartBridge.cod
        $codFile = Get-Item "BBSmartBridge.cod" -ErrorAction SilentlyContinue
        if (-not $codFile -or $codFile.Length -lt 10000) {
            Write-Warning "Le fichier .cod n'a pas été produit correctement par Ant ($($codFile.Length) octets). Tentative directe complète..."
            $rapcExe = Join-Path $env:BLACKBERRY_JDE_HOME "bin\rapc.exe"
            $netRimApi = Join-Path $env:BLACKBERRY_JDE_HOME "lib\net_rim_api.jar"
            $classesDir = "build\classes"
            New-Item -ItemType Directory -Force -Path $classesDir | Out-Null
            
            # Compilation Java
            Write-Host "Compilation manuelle des classes Java..."
            $javaSources = Get-ChildItem -Path "src" -Filter "*.java" -Recurse | ForEach-Object { $_.FullName }
            & javac -source 1.4 -target 1.4 -bootclasspath "$netRimApi" -d "$classesDir" -encoding UTF-8 $javaSources
            
            # Prevérification CLDC 1.1 pour BlackBerry
            Write-Host "Exécution de preverify.exe pour compatibilité CLDC 1.1..."
            $preverifyExe = Join-Path $env:BLACKBERRY_JDE_HOME "bin\preverify.exe"
            $preverifiedDir = "build\preverified"
            New-Item -ItemType Directory -Force -Path $preverifiedDir | Out-Null
            & $preverifyExe -classpath "$netRimApi" -d "$preverifiedDir" "$classesDir"
            $packDir = if (Test-Path "$preverifiedDir\com\hamza\blackberrybridge\SmartBridgeApp.class") { $preverifiedDir } else { $classesDir }

            # Copie de l'icône
            Copy-Item "icon.png" "$packDir\icon.png" -Force
            New-Item -ItemType Directory -Force -Path "$packDir\res" | Out-Null
            Copy-Item "icon.png" "$packDir\res\icon.png" -Force
            
            # Création du JAR
            Write-Host "Création de BBSmartBridge.jar depuis $packDir..."
            & jar cf "BBSmartBridge.jar" -C "$packDir" .
            
            # Invocation RAPC avec le rapc et le jar
            Write-Host "Exécution de rapc.exe avec BBSmartBridge.rapc et BBSmartBridge.jar..."
            & $rapcExe "import=$netRimApi" "codename=BBSmartBridge" "BBSmartBridge.rapc" "BBSmartBridge.jar" 2>&1 | Tee-Object -FilePath "rapc_output.txt" -Append
            
            $codFile = Get-Item "BBSmartBridge.cod" -ErrorAction SilentlyContinue
        }
        
        if (-not $codFile) {
            Write-Error "ÉCHEC CRITIQUE : Aucun fichier BBSmartBridge.cod n'a été produit !"
            exit 1
        }
        
        if ($codFile.Length -lt 10000) {
            Write-Error "ÉCHEC CRITIQUE : BBSmartBridge.cod est anormalement petit ($($codFile.Length) octets). Les classes Java n'ont pas été compilées dans le COD !"
            exit 1
        }
        
        Write-Host "====================================================="
        Write-Host "COMPILATION RÉUSSIE AVEC SUCCÈS !"
        Write-Host "Taille du COD : $($codFile.Length) octets"
        Write-Host "====================================================="
        Get-ChildItem -Include "*.cod", "*.jad", "*.alx", "*.jar" | Format-Table Name, Length
        
        # Inspection si le .cod est une archive ZIP contenant des modules frères (>64KB)
        $bytes = [System.IO.File]::ReadAllBytes($codFile.FullName)
        if ($bytes.Length -gt 4 -and $bytes[0] -eq 0x50 -and $bytes[1] -eq 0x4B) {
            Write-Host "NOTE : BBSmartBridge.cod est une archive ZIP (>64Ko). Extraction des modules enfants..."
            Copy-Item -Path "BBSmartBridge.cod" -Destination "BBSmartBridge_archive.zip"
            Expand-Archive -Path "BBSmartBridge_archive.zip" -DestinationPath "." -Force
            Remove-Item -Path "BBSmartBridge_archive.zip" -Force
            Write-Host "Extraction terminée. Liste complète des fichiers .cod disponibles :"
            Get-ChildItem -Filter "*.cod" | Format-Table Name, Length
        }
        
        # Vérification et affichage du fichier .jad
        if (Test-Path "BBSmartBridge.jad") {
            Write-Host "--- Contenu de BBSmartBridge.jad ---"
            Get-Content "BBSmartBridge.jad" | Write-Host
            Write-Host "------------------------------------"
        }
        
        # Vérification du guide d'installation et génération du rapport de sécurité
        if (-not (Test-Path "INSTALLATION_GUIDE.txt")) {
            Write-Host "Création d'un guide d'installation minimal de secours..."
            Set-Content -Path "INSTALLATION_GUIDE.txt" -Value "Consultez le guide d'installation pour BlackBerry Curve 9300." -Encoding utf8
        }
        
        if (Test-Path "rapc_output.txt") {
            Select-String -Pattern "requires signing|Warning!:" -Path "rapc_output.txt" | Out-File "security-api-report.txt" -Encoding utf8
        }
        Write-Host "Rapport de sécurité et guide prêts."

    - name: 📦 Sauvegarde des fichiers d'installation BlackBerry
      uses: actions/upload-artifact@v4
      with:
        name: BBSB_BlackBerry_Curve_9300_v1.0.7
        path: |
          blackberry/*.cod
          blackberry/*.jad
          blackberry/*.alx
          blackberry/*.jar
          blackberry/INSTALLATION_GUIDE.txt
          blackberry/security-api-report.txt
          blackberry/rapc_output.txt
        if-no-files-found: error
